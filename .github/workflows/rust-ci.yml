name: Rust workspace CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: orchest-linux-x86_64
            extension: ''
          - os: windows-2022
            artifact: orchest-windows-x86_64
            extension: .exe
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tools
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build CLI and API release binaries
        run: cargo build --release --locked -p orchest-cli -p orchest-api
      - name: Upload CLI and API binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/orchest${{ matrix.extension }}
            target/release/orchest-api${{ matrix.extension }}
          if-no-files-found: error
